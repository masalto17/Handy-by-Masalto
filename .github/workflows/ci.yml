name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Create env file (la app declara .env como asset)
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations (ARB -> Dart)
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web (smoke build)
        run: flutter build web
