project_id = "event-radio-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = [
  "http://127.0.0.1:8080",
  "eventradio://login-callback",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[storage]
enabled = true
file_size_limit = "50MiB"
